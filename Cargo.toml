[workspace]
members = [
    "crates/yuki-cli",
    "crates/yuki-core",
    "crates/yuki-pm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["yuki contributors"]
license = "MIT"
repository = "https://github.com/yourusername/yuki"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
async-trait = "0.1"
