# Example YAML manifest for yuki
# This file demonstrates the structure and options available for the yuki manifest.

packages:
  scoop:
    prune: false
    packages:
      - name: git
      - name: 7zip
        bucket: extras
      - name: neovim
        bucket: main

  chocolatey:
    prune: false
    packages:
      - name: nodejs
        version: "20.11.0"
      - name: python
        version: "3.12.0"

  winget:
    packages:
      - name: Microsoft.PowerToys
      - name: Microsoft.WindowsTerminal
      - name: Microsoft.VisualStudioCode

configs:
  - source: ./configs/gitconfig
    target: ~/.gitconfig
    backup: true
